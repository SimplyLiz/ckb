name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, 'feature/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Keep in sync with release.yml. The released linux binaries must start on
  # RHEL 9 / Amazon Linux 2023 (glibc 2.34), Ubuntu 22.04 (2.35) and Debian 12
  # (2.36); see scripts/check-glibc-floor.go and #243.
  GLIBC_FLOOR: "2.34"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install scip-go
        run: go install github.com/scip-code/scip-go/cmd/scip-go@latest

      - name: Run tests
        run: go test -v -race ./...

  golden:
    name: Golden Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run golden tests
        run: go test ./internal/query/... -run TestGolden -v

      - name: Verify goldens are committed
        run: |
          go test ./internal/query/... -run TestGolden -update
          if ! git diff --exit-code testdata/fixtures/*/expected/; then
            echo "::error::Golden files are out of date! Run: go test ./internal/query/... -run TestGolden -update"
            git diff testdata/fixtures/*/expected/
            exit 1
          fi

  review-tests:
    name: Review Engine Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run review engine tests
        run: go test -v -race ./internal/query/... -run "TestReview|TestHealth|TestBaseline|TestFingerprint|TestSave|TestList|TestLoad|TestCompare|TestCheckTraceability|TestCheckIndependence|TestClassify|TestEstimate|TestSuggest|TestBFS|TestIsConfig|TestDefault|TestDetect|TestMatch|TestCalculate|TestDetermine|TestSort|TestContainsSource|TestCodeHealth|TestCountLines|TestComplexity|TestFileSize"

      - name: Run format tests
        run: go test -v ./cmd/ckb/... -run "TestFormatSARIF|TestFormatCodeClimate|TestFormatGitHubActions|TestFormatHuman_|TestFormatMarkdown|TestFormatCompliance"

      - name: Run review golden tests
        run: go test -v ./cmd/ckb/... -run "TestGolden"

      - name: Verify review goldens are committed
        run: |
          go test ./cmd/ckb/... -run TestGolden -update-golden
          if ! git diff --exit-code testdata/review/; then
            echo "::error::Review golden files are out of date! Run: go test ./cmd/ckb/... -run TestGolden -update-golden"
            git diff testdata/review/
            exit 1
          fi

  tidycheck:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Check go mod tidy
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "::error::go.mod or go.sum not tidy. Run 'go mod tidy' and commit."
            git diff go.mod go.sum
            exit 1
          fi

      # internal/version.Version is the only place the version is written down.
      # Everything that has to repeat it is derived; this fails if any of them
      # drifted. npm/package.json's platform pins sat three releases behind
      # before this check existed, because the release pipeline overwrites them
      # at publish time and nothing else ever looked.
      - name: Check version sites are in sync
        run: go run scripts/sync-version.go --check

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test, review-tests, tidycheck, security]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build binary
        run: go build -ldflags="-s -w" -o ckb ./cmd/ckb

      - name: Verify binary
        run: ./ckb version

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ckb-linux-amd64
          path: ckb
          retention-days: 7

  glibc-floor:
    name: glibc floor (${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            goarch: amd64
          - os: ubuntu-22.04-arm
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true

      # Mirrors the release build exactly — same runner image, same cgo +
      # cartographer link. A plain `go build` would not reproduce the problem,
      # because the symbols that caused #243 come from the Rust static lib.
      - name: Build the way the release does
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/fetch-cartographer-lib.sh linux ${{ matrix.goarch }}
          CGO_ENABLED=1 go build -tags cartographer -ldflags="-s -w" -o ckb ./cmd/ckb

      - name: Check glibc floor
        run: go run scripts/check-glibc-floor.go --max "$GLIBC_FLOOR" ./ckb

      - name: Verify it runs
        run: ./ckb version

  pr-review:
    name: PR Review
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download CKB binary
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ckb-linux-amd64

      - name: Build CKB (fallback)
        if: steps.download.outcome == 'failure'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build CKB binary (fallback)
        if: steps.download.outcome == 'failure'
        run: go build -ldflags="-s -w" -o ckb ./cmd/ckb

      - name: Install CKB
        run: chmod +x ckb && sudo mv ckb /usr/local/bin/

      - name: Initialize and index
        run: |
          ckb init
          ckb index 2>/dev/null || echo "Indexing skipped (no supported indexer)"

      - name: Run review
        id: review
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set +e
          ckb review --ci --base="${BASE_REF}" --format=json > review.json 2>review_err.txt
          EXIT_CODE=$?
          set -e

          echo "verdict=$(jq -r '.verdict // "unknown"' review.json)" >> "$GITHUB_OUTPUT"
          echo "score=$(jq -r '.score // 0' review.json)" >> "$GITHUB_OUTPUT"
          echo "findings=$(jq -r '.findings | length // 0' review.json)" >> "$GITHUB_OUTPUT"
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

      - name: GitHub Actions annotations
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: ckb review --base="${BASE_REF}" --format=github-actions 2>/dev/null || true

      - name: Post PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          MARKDOWN=$(ckb review --base="${BASE_REF}" --format=markdown 2>/dev/null || echo "CKB review failed to generate output.")
          MARKER="<!-- ckb-review-marker -->"

          COMMENT_ID=$(gh api \
            "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" \
            2>/dev/null | head -1)

          if [ -n "${COMMENT_ID}" ]; then
            gh api \
              "repos/${GH_REPO}/issues/comments/${COMMENT_ID}" \
              -X PATCH \
              -f body="${MARKDOWN}"
          else
            gh api \
              "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
              -f body="${MARKDOWN}"
          fi

      - name: Summary
        env:
          VERDICT: ${{ steps.review.outputs.verdict }}
          SCORE: ${{ steps.review.outputs.score }}
          FINDINGS: ${{ steps.review.outputs.findings }}
        run: |
          echo "### CKB Review" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Verdict | ${VERDICT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Findings | ${FINDINGS} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on review verdict
        env:
          REVIEW_EXIT_CODE: ${{ steps.review.outputs.exit_code }}
          SCORE: ${{ steps.review.outputs.score }}
        run: |
          if [ "${REVIEW_EXIT_CODE}" = "1" ]; then
            echo "::error::CKB review failed (score: ${SCORE})"
            exit 1
          fi

