name: Secret Detection

on:
  workflow_call:
    inputs:
      scan_ckb:
        description: 'Run CKB secret scanner'
        type: boolean
        default: true
      scan_gitleaks:
        description: 'Run Gitleaks scanner'
        type: boolean
        default: false
      scan_trufflehog:
        description: 'Run TruffleHog scanner'
        type: boolean
        default: true
      min_severity:
        description: 'Minimum severity to report'
        type: string
        default: 'high'
      scan_history:
        description: 'Scan git history'
        type: boolean
        default: false
    outputs:
      ckb_findings:
        description: 'CKB secret findings count'
        value: ${{ jobs.secrets.outputs.ckb_findings }}
      gitleaks_findings:
        description: 'Gitleaks findings count'
        value: ${{ jobs.secrets.outputs.gitleaks_findings }}
      trufflehog_findings:
        description: 'TruffleHog verified secrets count'
        value: ${{ jobs.secrets.outputs.trufflehog_findings }}
      total_findings:
        description: 'Total secret findings'
        value: ${{ jobs.secrets.outputs.total_findings }}
      errors:
        description: 'Errors encountered during scanning'
        value: ${{ jobs.secrets.outputs.errors }}

jobs:
  secrets:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    outputs:
      ckb_findings: ${{ steps.ckb.outputs.findings }}
      gitleaks_findings: ${{ steps.gitleaks.outputs.findings }}
      trufflehog_findings: ${{ steps.trufflehog.outputs.findings }}
      total_findings: ${{ steps.summary.outputs.total }}
      errors: ${{ steps.summary.outputs.errors }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: ${{ inputs.scan_history && 0 || 50 }}

      # ==================== CKB Secret Scanner ====================
      - name: Set up Go (for CKB)
        if: inputs.scan_ckb
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: 'go.mod'
          cache: true
        continue-on-error: true

      - name: Build CKB
        if: inputs.scan_ckb
        run: |
          if [ -f "go.mod" ]; then
            go build -o ckb ./cmd/ckb 2>/dev/null || echo "CKB build skipped (not a CKB repo)"
          fi
        continue-on-error: true

      - name: CKB Secret Scan
        id: ckb
        if: inputs.scan_ckb
        env:
          MIN_SEVERITY: ${{ inputs.min_severity }}
        run: |
          if [ -x "./ckb" ]; then
            ./ckb init 2>/dev/null || true
            ./ckb scan-secrets --min-severity="$MIN_SEVERITY" \
              --exclude="internal/secrets/patterns.go" \
              --exclude="*_test.go" \
              --exclude="testdata/*" \
              --output=json > ckb-secrets.json || true

            FINDINGS=$(jq -r '.summary.totalFindings // 0' ckb-secrets.json 2>/dev/null || echo "0")
            echo "findings=$FINDINGS" >> $GITHUB_OUTPUT

            # Generate SARIF
            ./ckb scan-secrets --min-severity="$MIN_SEVERITY" \
              --exclude="internal/secrets/patterns.go" \
              --exclude="*_test.go" \
              --exclude="testdata/*" \
              --output=sarif > ckb-secrets.sarif || true
          else
            echo "findings=0" >> $GITHUB_OUTPUT
            echo "CKB not available, skipping"
          fi

      - name: Validate and Upload CKB SARIF
        id: ckb_sarif
        if: inputs.scan_ckb && hashFiles('ckb-secrets.sarif') != ''
        run: |
          # Validate SARIF has results array before uploading
          if jq -e '.runs[0].results' ckb-secrets.sarif > /dev/null 2>&1; then
            echo "valid=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::CKB generated invalid SARIF (missing results array)"
            echo "valid=false" >> $GITHUB_OUTPUT
            echo "error=CKB SARIF invalid" >> $GITHUB_OUTPUT
            rm -f ckb-secrets.sarif
          fi

      - name: Upload CKB SARIF to Code Scanning
        if: inputs.scan_ckb && steps.ckb_sarif.outputs.valid == 'true'
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: ckb-secrets.sarif
          category: ckb-secrets
        continue-on-error: true

      # ==================== Gitleaks ====================
      - name: Install Gitleaks
        if: inputs.scan_gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar xz
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Gitleaks Scan
        id: gitleaks
        if: inputs.scan_gitleaks
        run: |
          gitleaks detect --source . --report-format json --report-path gitleaks.json || true
          gitleaks detect --source . --report-format sarif --report-path gitleaks.sarif || true

          if [ -f gitleaks.json ]; then
            FINDINGS=$(jq 'length' gitleaks.json 2>/dev/null || echo "0")
            echo "findings=$FINDINGS" >> $GITHUB_OUTPUT
          else
            echo "findings=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload Gitleaks SARIF
        if: inputs.scan_gitleaks && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
        continue-on-error: true

      # ==================== TruffleHog ====================
      - name: Install TruffleHog
        if: inputs.scan_trufflehog
        env:
          TRUFFLEHOG_VERSION: '3.93.8'
        run: |
          curl -sSfL "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz" -o trufflehog.tar.gz
          tar xzf trufflehog.tar.gz trufflehog
          chmod +x trufflehog
          sudo mv trufflehog /usr/local/bin/
          rm trufflehog.tar.gz

      - name: TruffleHog Scan
        id: trufflehog
        if: inputs.scan_trufflehog
        run: |
          # --fail returns exit code 183 when verified secrets found
          trufflehog filesystem . --only-verified --json --fail > trufflehog.json 2>/dev/null || true

          if [ -f trufflehog.json ] && [ -s trufflehog.json ]; then
            FINDINGS=$(wc -l < trufflehog.json | tr -d ' ')
            echo "findings=$FINDINGS" >> $GITHUB_OUTPUT
            if [ "$FINDINGS" -gt 0 ]; then
              echo "::error::TruffleHog found $FINDINGS verified secret(s)"
            fi
          else
            echo "findings=0" >> $GITHUB_OUTPUT
          fi

      # ==================== Summary ====================
      - name: Calculate totals
        id: summary
        env:
          CKB_FINDINGS: ${{ steps.ckb.outputs.findings || 0 }}
          GITLEAKS_FINDINGS: ${{ steps.gitleaks.outputs.findings || 0 }}
          TRUFFLEHOG_FINDINGS: ${{ steps.trufflehog.outputs.findings || 0 }}
          CKB_SARIF_ERROR: ${{ steps.ckb_sarif.outputs.error || '' }}
        run: |
          CKB="$CKB_FINDINGS"
          GITLEAKS="$GITLEAKS_FINDINGS"
          TRUFFLEHOG="$TRUFFLEHOG_FINDINGS"
          TOTAL=$((CKB + GITLEAKS + TRUFFLEHOG))
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

          # Collect errors
          ERRORS=""
          if [ "$CKB_SARIF_ERROR" != "" ]; then
            ERRORS="CKB: $CKB_SARIF_ERROR"
          fi
          echo "errors=$ERRORS" >> $GITHUB_OUTPUT

          echo "### Secret Detection Results" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Findings |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| CKB | $CKB |" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks | $GITLEAKS |" >> $GITHUB_STEP_SUMMARY
          echo "| TruffleHog (verified) | $TRUFFLEHOG |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total** | **$TOTAL** |" >> $GITHUB_STEP_SUMMARY

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: secret-scan-results
          path: |
            ckb-secrets.json
            ckb-secrets.sarif
            gitleaks.json
            gitleaks.sarif
            trufflehog.json
          retention-days: 30
          if-no-files-found: ignore
